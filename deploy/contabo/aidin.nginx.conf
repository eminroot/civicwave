# CivicWave. The container in /opt/civicwave listens on 127.0.0.1:8120 (certbot adds the HTTPS part).
server {
    listen 80;
    listen [::]:80;
    server_name aidin.173.212.195.158.sslip.io;

    # report photos from the phone (the server itself caps them at 12 MB)
    client_max_body_size 15M;

    # the command center's live feed: no buffering, long-lived
    location = /api/events {
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, never appended, so a client cannot choose the address the server sees.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # the AI photo check can take a while
        proxy_read_timeout 120s;
    }
}
